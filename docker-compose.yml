services:
  mysql:
    image: mysql:8.0
    container_name: clawreport-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root@2026
      MYSQL_DATABASE: reporthub
      MYSQL_USER: clawreport
      MYSQL_PASSWORD: ReportHub@2026
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clawreport-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reporthub?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: clawreport
      SPRING_DATASOURCE_PASSWORD: ReportHub@2026
      JWT_SECRET: "ClawReportSecretKey2026MustBeAtLeast256BitsLong!"
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clawreport-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql_data:
